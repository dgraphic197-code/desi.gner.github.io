<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logo & Branding | Designer 197</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#080808;
    color:#fff;
}

header{
    padding:22px 7%;
    border-bottom:1px solid rgba(255,255,255,.1);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:800;
    letter-spacing:2px;
}

.back{
    color:#fff;
    text-decoration:none;
    font-size:14px;
    border:1px solid rgba(255,255,255,.2);
    padding:10px 18px;
    border-radius:30px;
}

.back:hover{
    background:#fff;
    color:#000;
}

.hero{
    text-align:center;
    padding:80px 20px 50px;
}

.hero span{
    color:#aaa;
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
}

.hero h1{
    font-size:48px;
    margin:15px 0;
}

.hero p{
    color:#aaa;
    max-width:600px;
    margin:auto;
    line-height:1.7;
}

.gallery{
    width:86%;
    max-width:1300px;
    margin:20px auto 80px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.card{
    background:#111;
    border-radius:14px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
    border-color:rgba(255,255,255,.25);
}

.card img{
    width:100%;
    height:360px;
    object-fit:cover;
    display:block;
}

.card-info{
    padding:18px;
}

.card-info h3{
    font-size:18px;
}

.card-info p{
    color:#888;
    margin-top:7px;
    font-size:13px;
}

footer{
    text-align:center;
    padding:30px;
    border-top:1px solid rgba(255,255,255,.1);
    color:#777;
}

@media(max-width:800px){
    .gallery{
        grid-template-columns:repeat(2,1fr);
    }

    .hero h1{
        font-size:36px;
    }
}

@media(max-width:550px){
    .gallery{
        grid-template-columns:1fr;
    }

    header{
        padding:18px 5%;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">
DESIGNER 197
</div>

<a href="index.html" class="back">
← Back to Portfolio
</a>

</header>


<section class="hero">

<span>Selected Work</span>

<h1>Logo & Branding</h1>

<p>
A collection of logo designs, brand identities and creative visual concepts.
</p>

</section>


<section class="gallery">


<!-- LOGO 1 -->

<div class="card">

<img src="126964242873967.697a4a33b146d.png"
alt="Logo Design 1">

<div class="card-info">

<h3>Logo Design</h3>

<p>Brand Identity</p>

</div>

</div>


<!-- LOGO 2 -->

<div class="card">

<img src="2%20%2816%29.png"
alt="Logo Design 2">

<div class="card-info">

<h3>Brand Identity</h3>

<p>Logo & Visual Design</p>

</div>

</div>


<!-- LOGO 3 -->

<div class="card">

<img src="1%281%29.jpeg"
alt="Logo Design 3">

<div class="card-info">

<h3>Creative Logo</h3>

<p>Brand Identity</p>

</div>

</div>

</section>


<footer>

© 2026 DESIGNER 197 · Logo & Branding

</footer>

</body>
</html>
